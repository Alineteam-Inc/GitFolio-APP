<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitFolio</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      :root { font-size: 13px; }
      body { display: grid; grid-template-columns: 150px 1fr; height: 100vh; padding: 0; box-sizing: border-box; background: Canvas; }
      /* The menu, apart from the page: its own shade and edge, the section open in the accent color. */
      nav { padding: 10px 8px; background: rgb(127 127 127 / 0.1); border-right: 1px solid rgb(127 127 127 / 0.25); }
      nav button { display: block; width: 100%; min-width: 0; margin: 1px 0; padding: 0 10px; text-align: left; border-radius: 6px; background: transparent; }
      nav button.on { background: #0a84ff; color: #fff; }
      /* Room to read: wider margins and spacing, the page's buttons at its foot. */
      main { display: flex; flex-direction: column; overflow: auto; padding: 20px 28px; line-height: 1.5; }
      main h1 { font-size: 18px; margin: 4px 0 14px; }
      main h2 { margin: 22px 0 8px; }
      main p { margin: 8px 0; }
      main label { margin: 10px 0; }
      main .row { margin: 14px 0; }
      main > .actions { margin-top: auto; padding-top: 20px; }
      main td .row { margin: 0; }
      /* The repositories: one line each. The counts' columns are as wide as their words and never cut; the name and
         path take the rest (width 100%, max-width 0) and are cut short only when that is too narrow. */
      table.repos th, table.repos td { white-space: nowrap; padding: 7px 8px; border-bottom: 1px solid rgb(127 127 127 / 0.2); }
      table.repos td.where { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
      table.repos .num { text-align: right; }
      table.repos td.icons { padding: 2px 4px; }
      table.repos thead th { position: sticky; top: 0; z-index: 1; background: Canvas; font-size: 11px;
        opacity: 1; color: color-mix(in srgb, CanvasText 60%, transparent); } /* dim by colour: the rows under it must not show through */
      table.repos tr.more:has(.repo-box:empty) { display: none; } /* opened by details or removing */
      /* What opens under a line wraps within the box, rather than widening the table past it. */
      table.repos tr.more td { white-space: normal; max-width: 0; }
      /* A narrow box drops the hooks' column (nearly always "on"), then the last commit's (in the details), to keep
         the name readable and the buttons whole. */
      .scroll.tall { container-type: inline-size; }
      @container (max-width: 520px) { table.repos .hooks { display: none; } }
      @container (max-width: 440px) { table.repos .last { display: none; } }
      .repo-box { padding: 2px 0 6px; }
      .nested { padding-left: 22px; } /* a repository's files, under its own box */
      /* History: a run a line, opened by a click to its git commands, each wrapping within the box. */
      details.run { padding: 5px 0; border-bottom: 1px solid rgb(127 127 127 / 0.2); overflow-wrap: anywhere; }
      details.run summary { cursor: pointer; }
      details.run div { padding-left: 18px; }
      .facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; padding: 6px 8px; }
      .facts span { overflow-wrap: anywhere; }
      main .actions .actions { margin: 0; } /* a step's own buttons, in the setup's foot */
      main > .foot { justify-content: space-between; }
      header.repos-head { margin: 22px 0 8px; }
      header.repos-head h2 { margin: 0; }
      /* The time picker: steppers for hour and minute, AM/PM as two joined buttons, the chosen one lit. */
      .time { display: flex; align-items: center; gap: 6px; }
      .time .num { font-size: 22px; min-width: 2ch; text-align: center; }
      .stepper { display: flex; flex-direction: column; align-items: center; }
      .stepper button { height: 20px; min-width: 36px; padding: 0; font-size: 10px; background: transparent; }
      .ampm { display: flex; margin-left: 10px; }
      .ampm button { min-width: 52px; border-radius: 0; }
      .ampm button:first-child { border-radius: 6px 0 0 6px; }
      .ampm button:last-child { border-radius: 0 6px 6px 0; }
      .ampm button.on { background: #0a84ff; color: #fff; } /* Back at the left, a step's buttons at the right */
      main > .scroll.tall { flex: 1 1 0; max-height: none; min-height: 140px; } /* a page's main box takes the room left, down to its foot */
      body.setup { grid-template-columns: 1fr; }
      body.setup nav { display: none; } /* buttons in a table's cell, level with its words */
      body:has(> .progress:not([hidden])) { padding-bottom: 28px; } /* the page above the progress, never under it */
    </style>
  </head>
  <body>
    <nav id="nav"></nav>
    <main id="main"></main>
    <div id="progress" class="progress" hidden></div>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script src="manage.js"></script>
  </body>
</html>
