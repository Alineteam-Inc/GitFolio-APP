<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitFolio</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      /* The content scrolls between the name and the foot; the foot's icons stay put. */
      body { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
      main { flex: 1; overflow: auto; scrollbar-gutter: stable; padding: 0 4px 10px 0; } /* room for the scrollbar, off the text, and at the foot */
      /* The state: the account at the left, the sync mode at the right; the rest under them at the right. */
      .state-line { display: flex; justify-content: space-between; gap: 8px; }
      .state-line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .right { text-align: right; justify-content: flex-end; }
      #state { margin-bottom: 8px; }
      body:has(> .progress:not([hidden])) { padding-bottom: 36px; } /* the foot above the progress */
      footer { display: flex; align-items: center; gap: 4px; padding-top: 8px; border-top: 1px solid rgb(127 127 127 / 0.2); }
      footer .spacer { flex: 1; text-align: center; font-size: 11px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer .spacer.ok { opacity: 1; }
      footer button { min-width: 32px; width: 32px; padding: 0; background: transparent; display: grid; place-items: center; }
      footer button:hover { background: rgb(127 127 127 / 0.2); }
      footer svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <header><strong id="name">GitFolio</strong><span id="last" class="dim"></span></header>
    <main>
      <section id="state"><p class="dim">…</p></section>
      <section id="result"></section>
      <section id="stats"></section>
      <section id="stack"></section>
    </main>
    <footer>
      <button id="refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 4v5h-5" /></svg></button>
      <button id="sync" hidden><svg viewBox="0 0 24 24"><path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M5 20h14" /></svg></button>
      <span class="spacer" id="unsent"></span>
      <button id="settings"><svg viewBox="0 0 24 24"><path d="M19.3 9.8 L21.8 10.0 L21.8 14.0 L19.3 14.2 L18.7 15.5 L20.3 17.5 L17.5 20.3 L15.5 18.7 L14.2 19.3 L14.0 21.8 L10.0 21.8 L9.8 19.3 L8.5 18.7 L6.5 20.3 L3.7 17.5 L5.3 15.5 L4.7 14.2 L2.2 14.0 L2.2 10.0 L4.7 9.8 L5.3 8.5 L3.7 6.5 L6.5 3.7 L8.5 5.3 L9.8 4.7 L10.0 2.2 L14.0 2.2 L14.2 4.7 L15.5 5.3 L17.5 3.7 L20.3 6.5 L18.7 8.5 Z" /><circle cx="12" cy="12" r="3" /></svg></button>
      <button id="quit"><svg viewBox="0 0 24 24"><path d="M12 3v9" /><path d="M6.3 6.3a8 8 0 1 0 11.4 0" /></svg></button>
    </footer>
    <div id="progress" class="progress" hidden></div>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
    <script src="index.js"></script>
  </body>
</html>
