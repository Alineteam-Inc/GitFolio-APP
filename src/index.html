<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitFolio</title>
    <link rel="stylesheet" href="app.css" />
    <style>
      #state { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <header>
      <strong>GitFolio</strong>
      <span class="row" id="buttons"></span>
    </header>
    <section id="state"><p class="dim">…</p></section>
    <div id="progress" class="row dim" hidden></div>
    <section id="stats"></section>
    <section id="stack"></section>
    <script src="app.js"></script>
    <script>
      if (navigator.userAgent.includes("Mac")) document.documentElement.classList.add("glass"); // see lib.rs
      const open = (section) => call("open", { section });
      const goTo = open; // where an error is solved (app.js): the GitFolio window

      // gitfolio status --json, in a line: the account, the sync mode and the last sync.
      function drawState(s) {
        if (!s.setUp) {
          return [el("p", "", s.account ? "Choose the repositories to collect." : "Set up GitFolio to collect your commits."),
            el("div", "row", button("Set up", () => open("setup")))];
        }
        const local = s.syncMode === "local";
        const last = s.lastSync ? `last sync ${when(s.lastSync)}` : "not synced yet";
        const result = el("div", "");
        return [
          el("p", "dim", `${s.account} · ${local ? "local mode" : "automatic"} · ${last}`),
          s.lastSyncError ? el("p", "error", s.lastSyncError) : "",
          // Local mode sends nothing by itself, so what is not sent only grows there.
          !local && s.unsent ? el("p", "", `${s.unsent} commits not sent yet`) : "",
          el("div", "row", button("Sync now", () => fill(result, async () => drawSync(await gitfolio("sync"))))),
          result,
        ];
      }

      // The state first, from this computer only; then, with an account, the developer type and stack:
      // one after the other, as each may sync first and the second then finds nothing left to send.
      async function load(refresh) {
        let s;
        await fill($("state"), async () => drawState((s = await gitfolio("status"))));
        if (!s?.account) return $("stats").replaceChildren(), $("stack").replaceChildren();
        await fill($("stats"), async () => drawStats(await gitfolio("stats", ...(refresh ? ["--refresh"] : []))));
        await fill($("stack"), async () => drawStack(await gitfolio("stack")));
      }

      $("buttons").append(button("Open", () => open("overview")), button("Refresh", () => load(true)));
      // Once, on the first open, not every time: stats and stack may ask aline.team, and send in local mode.
      window.addEventListener("focus", () => load(false), { once: true });
    </script>
  </body>
</html>
