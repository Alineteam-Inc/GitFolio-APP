name: release

# Push a tag like v0.1.0 (the version in src-tauri/tauri.conf.json) on main: the packages are built and
# started on each system (build.yml), with the gitfolio CLI release below, and published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release only from main # stage is the dev branch; the packages follow main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: The tag is the app's version
        run: |
          v=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME, but tauri.conf.json says $v"; exit 1; }

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    secrets: inherit # the updater's signing key
    with:
      cli-ref: v0.6.0 # the gitfolio CLI release the app ships

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance (Sigstore)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      # What installed apps update from (tauri.conf.json plugins.updater): each package the updater installs,
      # by {os}-{arch}-{bundle type}, with its signature.
      - name: latest.json
        run: |
          cd dist
          base=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
          p='{}'
          add() { [ -f "$2.sig" ] && p=$(jq --arg k "$1" --arg u "$base/$2" --rawfile s "$2.sig" '. + {($k): {url: $u, signature: ($s | rtrimstr("\n"))}}' <<< "$p") || true; }
          add darwin-aarch64-app GitFolio_macos_arm64.app.tar.gz
          add darwin-x86_64-app GitFolio_macos_x64.app.tar.gz
          add windows-x86_64-nsis GitFolio_windows_x64-setup.exe
          add linux-x86_64-deb GitFolio_linux_amd64.deb
          add linux-x86_64-rpm GitFolio_linux_amd64.rpm
          add linux-aarch64-deb GitFolio_linux_arm64.deb
          add linux-aarch64-rpm GitFolio_linux_arm64.rpm
          [ "$p" != '{}' ] || { echo "::error::no signed packages: is the TAURI_SIGNING_PRIVATE_KEY secret set?"; exit 1; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%FT%TZ)" --argjson p "$p" '{version: $v, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
      - run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      # Signed proof that each package was built here from this tag's source; users check it with
      # gh attestation verify <package> -R Alineteam-Inc/GitFolio-GUI (README).
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "GitFolio $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
